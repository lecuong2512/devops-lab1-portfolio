# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động kiểm tra, audit Lighthouse và deploy website lên GitHub Pages
# ============================================================

name: Deploy to GitHub Pages

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main]       # Chạy khi push lên nhánh main
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

permissions:
  contents: write

# === Các job trong pipeline ===
jobs:
  # Job: Build, Audit & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest   # Chạy trên máy ảo Ubuntu (free)

    steps:
      # Step 1: Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra cấu trúc các trang HTML và ảnh Avatar
      - name: Validate Multi-page HTML & Assets
        run: |
          echo "Checking HTML pages and assets exist..."
          for file in index.html about.html contact.html avatar.png favicon.ico; do
            if [ -f "$file" ]; then
              echo "✅ $file found! (Size: $(wc -c < "$file") bytes)"
            else
              echo "❌ $file NOT found!"
              exit 1
            fi
          done

      # Step 3: Google Lighthouse CI Audit (Performance, Accessibility, SEO)
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      # Step 4: Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "Auto-deploy multi-page portfolio from CI pipeline"
